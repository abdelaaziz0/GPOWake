[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpowake"
version = "0.4.0"
description = "Candidate-path detector for dormant Active Directory Group Policy weaponization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "GPOWake contributors"}]

[project.optional-dependencies]
collect = [
  "ldap3>=2.10.2",
  "impacket>=0.12",
  "gssapi>=1.8; sys_platform != 'win32'",
]
dev = [
  "bandit>=1.9.4",
  "build>=1",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "pip-audit>=2.10.1",
  "ruff>=0.8",
]

[project.scripts]
gpowake = "gpowake.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F821"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
