name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests benchmarks scripts
      - run: mypy src
      - run: bandit -r src scripts -ll
      - run: python -m pytest tests/test_security_hardening.py
      - run: python -m pytest --cov=gpowake --cov-report=term --cov-fail-under=75
      - run: python benchmarks/benchmark_solver.py --profile all --iterations 1 --max-seconds 20 --max-peak-mib 256

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[collect,dev]"
      - run: pip-audit --local --strict --skip-editable

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  windows-model:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "setuptools>=77" build
      - name: Verify signed release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          git -c gpg.format=ssh
          -c gpg.ssh.allowedSignersFile=maintainers/allowed_signers
          verify-tag "${GITHUB_REF_NAME}"
      - run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          python -m build --no-isolation
          python scripts/normalize_release_archives.py --epoch "$SOURCE_DATE_EPOCH" dist/*
          python scripts/verify_reproducible_build.py --reference dist
      - run: python scripts/check_release_archive.py dist/*
      - run: python scripts/generate_release_metadata.py --dist dist --commit "$(git rev-parse HEAD)"
      - name: Attest wheel provenance
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.whl
      - name: Attest sdist provenance
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - name: Attest wheel SBOM
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.whl
          sbom-path: dist/*.spdx.json
      - name: Attest sdist SBOM
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/*.spdx.json
      - run: python -m pip install dist/*.whl
      - run: gpowake --version
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: gpowake-dist
          path: dist/
