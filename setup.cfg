[metadata]
name = gpowake
version = 0.1.0
description = Counterfactual detector for dormant Active Directory Group Policy weaponization
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = GPOWake contributors

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = src

[options.extras_require]
collect =
    ldap3>=2.9
    impacket>=0.12
    gssapi>=1.8; sys_platform != "win32"
dev =
    pytest>=8
    pytest-cov>=5

[options.entry_points]
console_scripts =
    gpowake = gpowake.cli:main
